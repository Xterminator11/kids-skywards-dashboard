[project]
name = "kids-gradebook"
version = "0.1.0"
description = "Daily Skyward Family Access gradebook scraper"
requires-python = ">=3.11"
dependencies = [
    "playwright==1.48.0",       # must match the Playwright Docker image tag
    "beautifulsoup4==4.12.3",
    "python-dotenv==1.0.1",
    "APScheduler==3.10.4",
    "tzdata==2024.2",
]

[dependency-groups]
dev = ["pytest==8.3.3"]

[tool.uv]
package = false   # an app run with `python -m gradebook`, not a library to install

[tool.pytest.ini_options]
testpaths = ["tests"]
