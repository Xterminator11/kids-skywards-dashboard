<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Creature Island</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@400;600;700;800&display=swap">
<style>

/* Layout: one tall phone-first column (quests, island, podium, team, finish), widening to two columns on tablets. Single pastel daytime world by choice. */
:root{
  color-scheme: light;
  --sky:#E6F1FF; --sky2:#FCEFF6;
  --ink:#3B3355; --ink-soft:#6E6688;
  --card:#FFFFFF; --line:#E9E3F5;
  --lav:#DCD2FA; --mint:#C8F0DC; --peach:#FFD6C2; --butter:#FFF0B3; --blush:#FFD3E4; --pool:#CDE6FF;
  --sea:#A9D8F5; --grass:#BFEAB4; --sand:#F7E3B5;
  --gold:#F5C542; --silver:#C9D1E3; --bronze:#E8A77C;
  --accent:#E0558F; --accent-ink:#FFFFFF; --accent-soft:#FFE1EE;
  --good:#3BA776; --waiting:#8A7CC9;
  --display:"Fredoka", "Baloo 2", "Trebuchet MS", system-ui, sans-serif;
  --body:"Nunito", "Segoe UI", system-ui, sans-serif;
  --r-lg:28px; --r-md:18px; --r-sm:12px;
}
body.k-manya{ --accent:#2E9C8F; --accent-soft:#D9F3EE; --sky2:#EEF7F1; }
html,body{min-height:100%}
body{margin:0;background:linear-gradient(180deg,var(--sky) 0%,var(--sky2) 100%) fixed;color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 40px}
h1,h2,h3{font-family:var(--display);font-weight:600;margin:0;text-wrap:balance;letter-spacing:.2px}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible,input:focus-visible,.spot:focus-visible{outline:3px solid var(--accent);outline-offset:3px;border-radius:14px}
.wrap{max-width:1040px;margin:0 auto;display:flex;flex-direction:column;gap:18px}

/* Top bar */
.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.hello{flex:1 1 220px;min-width:0}
.hello h1{font-size:clamp(28px,6vw,40px);line-height:1.05}
.hello p{margin:4px 0 0;color:var(--ink-soft);font-weight:600}
.chip{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:999px;background:var(--card);font-weight:800;box-shadow:0 2px 0 var(--line)}
.starchip{background:var(--butter)}
.iconbtn{width:44px;height:44px;border-radius:50%;background:var(--card);display:grid;place-items:center;box-shadow:0 2px 0 var(--line)}
.iconbtn svg{width:22px;height:22px}

.grid{display:grid;grid-template-columns:1fr;gap:18px}
@media (min-width:860px){.grid{grid-template-columns:1.05fr 1fr}.span2{grid-column:1/-1}}
.panel{background:var(--card);border-radius:var(--r-lg);padding:20px;box-shadow:0 4px 0 var(--line);min-width:0}
.panel h2{font-size:24px;display:flex;align-items:center;gap:10px}
.sub{color:var(--ink-soft);margin:4px 0 14px;font-weight:600}

/* Quests */
.quests{display:flex;flex-direction:column;gap:12px}
.quest{display:flex;align-items:center;gap:12px;padding:12px;border-radius:var(--r-md);background:var(--sky);transition:transform .2s}
.quest .mini{width:56px;height:56px;flex:none}
.quest .qt{flex:1;min-width:0}
.quest .qt b{display:block;font-size:17px;line-height:1.2;overflow-wrap:anywhere}
.quest .qt small{color:var(--ink-soft);font-weight:700}
.did{flex:none;padding:12px 16px;border-radius:999px;background:var(--accent);color:var(--accent-ink);font-family:var(--display);font-weight:600;font-size:16px;box-shadow:0 4px 0 rgba(0,0,0,.12);transition:transform .1s}
.did:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.12)}
.quest.claimed{background:#F1EEFB}
.quest.verified{background:#FFF6D6}
.tag{flex:none;padding:8px 12px;border-radius:999px;font-weight:800;font-size:13px;text-align:center}
.tag.wait{background:var(--lav);color:#4B3D8F}
.tag.gold{background:var(--gold);color:#5A4300}
.undo{font-size:12px;color:var(--ink-soft);text-decoration:underline;margin-left:4px}
.empty{display:flex;align-items:center;gap:14px;padding:14px;border-radius:var(--r-md);background:var(--mint)}
.empty .mini{width:72px;height:72px;flex:none}
details.left{margin-top:14px;border-radius:var(--r-md);background:#FAF8FF;padding:10px 14px}
details.left summary{cursor:pointer;font-weight:800;color:var(--ink-soft)}
details.left .quests{margin-top:10px}
details.left .quest{background:#fff}

/* Island */
.island{position:relative;border-radius:var(--r-lg);padding:26px 14px 30px;background:
  radial-gradient(120% 90% at 50% 55%, var(--grass) 0 54%, var(--sand) 55% 63%, var(--sea) 64% 100%);overflow:hidden}
.island .spots{position:relative;display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:6px 8px;justify-items:center}
.spot{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px;border-radius:16px;position:relative;width:100%;max-width:140px}
.spot:hover{background:rgba(255,255,255,.35)}
.spot .cw{width:96px;height:96px;position:relative}
.spot .nm{font-family:var(--display);font-weight:600;font-size:17px}
.spot .sj{font-size:12px;font-weight:800;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.6px;text-align:center}
.mood{font-size:12px;font-weight:800;padding:3px 9px;border-radius:999px;background:#fff}
.mood.low{background:#FFE7C7;color:#8A4B00}
.mood.party{background:var(--blush);color:#8E2456}
.mood.dance{background:var(--mint);color:#1F6B4A}
.mood.happy{background:var(--pool);color:#235C8E}
.mood.ready{background:var(--lav);color:#4B3D8F}
.deco{position:absolute;pointer-events:none}
.weeds{position:absolute;top:76px;left:50%;transform:translateX(-50%);width:120px;height:26px;pointer-events:none}
.specials{display:flex;align-items:center;gap:10px;margin-top:12px;padding:10px 12px;border-radius:var(--r-md);background:rgba(255,255,255,.7);font-weight:700}
.specials .mini{width:54px;height:54px;flex:none}

/* Podium */
.podium{display:grid;grid-template-columns:1fr 1fr 1fr;align-items:end;gap:8px;margin-top:6px}
.step{display:flex;flex-direction:column;align-items:center;gap:4px;min-width:0}
.step .cw{width:88px;height:88px}
.block{width:100%;border-radius:14px 14px 6px 6px;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding-top:8px;font-family:var(--display);font-weight:700;color:#4a3f20}
.block .place{font-size:28px;line-height:1}
.block .sname{font-size:13px;font-weight:600;text-align:center;padding:0 4px}
.block .pct{font-size:15px}
.p1 .block{background:linear-gradient(var(--gold),#EBB52A);height:120px}
.p2 .block{background:linear-gradient(var(--silver),#B3BDD3);height:92px}
.p3 .block{background:linear-gradient(var(--bronze),#D68F62);height:72px}
.comeback{display:flex;align-items:center;gap:12px;margin-top:14px;padding:12px;border-radius:var(--r-md);background:var(--blush)}
.comeback .cw{width:76px;height:76px;flex:none}
.comeback b{font-family:var(--display);font-size:18px;font-weight:600}
.comeback p{margin:2px 0 0;font-weight:600}

/* Team */
.team .dots{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.team .dot{width:34px;height:34px;border-radius:50%;background:var(--sky);display:grid;place-items:center;font-weight:800}
.team .dot.on{background:var(--good);color:#fff}
.reward{display:inline-block;padding:6px 12px;border-radius:999px;background:var(--butter);font-weight:800}

/* Finish */
.finish{display:flex;gap:12px;flex-wrap:wrap}
.bigbtn{flex:1 1 240px;padding:18px 20px;border-radius:24px;font-family:var(--display);font-size:22px;font-weight:600;box-shadow:0 5px 0 rgba(0,0,0,.12)}
.bigbtn.main{background:var(--accent);color:var(--accent-ink)}
.bigbtn.show{background:var(--lav);color:#3E2F86}
.bigbtn small{display:block;font-family:var(--body);font-size:13px;font-weight:700;opacity:.85}
.grownups{align-self:center;display:inline-flex;align-items:center;gap:8px;color:var(--ink-soft);font-weight:800;padding:8px 14px;border-radius:999px}
.grownups:hover{background:rgba(255,255,255,.6)}
.demo-note{text-align:center;color:var(--ink-soft);font-size:13px;font-weight:600;max-width:60ch;margin:0 auto}

/* Picker */
.picker{min-height:80vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:24px;text-align:center}
.picker h1{font-size:clamp(34px,8vw,56px)}
.pickrow{display:flex;gap:18px;flex-wrap:wrap;justify-content:center}
.pick{width:min(260px,80vw);padding:22px;border-radius:var(--r-lg);background:var(--card);box-shadow:0 6px 0 var(--line);display:flex;flex-direction:column;align-items:center;gap:8px;transition:transform .15s}
.pick:hover{transform:translateY(-4px)}
.pick .cw{width:130px;height:130px}
.pick b{font-family:var(--display);font-size:28px;font-weight:600}

/* Sheets / modals */
.scrim{position:fixed;inset:0;background:rgba(59,51,85,.45);display:flex;align-items:flex-end;justify-content:center;z-index:40;
  padding:16px max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
@media (min-width:700px){.scrim{align-items:center}}
.sheet{background:var(--card);border-radius:var(--r-lg);width:min(560px,100%);max-height:88vh;overflow:auto;padding:22px;position:relative}
.sheet h2{font-size:28px}
.close{position:absolute;top:12px;right:12px}
.bigc{width:170px;height:170px;margin:0 auto}
.center{text-align:center}
.bar{height:16px;border-radius:999px;background:var(--sky);overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--gold));border-radius:999px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.field{flex:1 1 160px;min-width:0;padding:12px 14px;border-radius:14px;border:2px solid var(--line);font:inherit;font-weight:700;color:var(--ink);background:#fff}
.btn{padding:12px 18px;border-radius:999px;background:var(--accent);color:var(--accent-ink);font-weight:800}
.btn.ghost{background:var(--sky);color:var(--ink)}
.list{display:flex;flex-direction:column;gap:8px;margin:12px 0;padding:0;list-style:none}
.list li{display:flex;gap:10px;align-items:center;padding:10px 12px;border-radius:14px;background:var(--sky);font-weight:700}
.list li .sc{margin-left:auto;font-family:var(--display);font-weight:600;white-space:nowrap}
.stage{display:flex;justify-content:center;gap:4px;flex-wrap:wrap;margin:10px 0}
.stage .cw{width:72px;height:72px}
.facts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px 0}
.fact{background:var(--sky);border-radius:14px;padding:10px;text-align:center}
.fact b{display:block;font-family:var(--display);font-size:26px;font-weight:600;font-variant-numeric:tabular-nums}
.fact span{font-size:12px;font-weight:800;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.5px}

/* PIN */
.pin{display:grid;grid-template-columns:repeat(3,64px);gap:10px;justify-content:center;margin:14px 0}
.pin button{height:64px;border-radius:50%;background:var(--sky);font-family:var(--display);font-size:24px;font-weight:600}
.pindots{display:flex;gap:10px;justify-content:center}
.pindots i{width:14px;height:14px;border-radius:50%;background:var(--line)}
.pindots i.on{background:var(--ink)}
.parent table{width:100%;border-collapse:collapse;font-size:14px}
.parent th,.parent td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line);vertical-align:top}
.parent th{font-size:12px;text-transform:uppercase;letter-spacing:.5px;color:var(--ink-soft)}
.tblwrap{overflow-x:auto}
.sms{background:#E9F2FF;border-radius:18px 18px 18px 4px;padding:10px 14px;margin:8px 0;font-weight:600;max-width:46ch}
.parent h3{font-size:18px;margin-top:18px}
.parent ul.rules{margin:8px 0;padding-left:20px}

/* Toast + confetti */
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 18px;border-radius:999px;font-weight:800;z-index:60;box-shadow:0 6px 20px rgba(0,0,0,.2);max-width:calc(100% - 32px);text-align:center}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:70;width:100%;height:100%}

/* Creature motion */
.c-dance{animation:dance .7s ease-in-out infinite alternate;transform-origin:50% 90%}
.c-party{animation:party .5s ease-in-out infinite alternate;transform-origin:50% 90%}
.c-happy{animation:bob 2.2s ease-in-out infinite;transform-origin:50% 90%}
.c-ready{animation:bob 1.4s ease-in-out infinite;transform-origin:50% 90%}
.c-sleepy{animation:breathe 3.2s ease-in-out infinite;transform-origin:50% 100%}
.c-hungry{animation:wobble 1.1s ease-in-out infinite;transform-origin:50% 90%}
.c-egg{animation:eggwig 2.6s ease-in-out infinite;transform-origin:50% 95%}
.c-munch{animation:munch .25s ease-in-out 5 alternate;transform-origin:50% 90%}
.zz{animation:zz 2.4s ease-in-out infinite}
.zz2{animation:zz 2.4s ease-in-out .8s infinite}
.arm-l{transform-origin:28px 78px}.arm-r{transform-origin:92px 78px}
.c-dance .arm-l,.c-party .arm-l{animation:wave .35s ease-in-out infinite alternate}
.c-dance .arm-r,.c-party .arm-r{animation:wave2 .35s ease-in-out infinite alternate}
@keyframes dance{from{transform:rotate(-9deg) translateY(0)}to{transform:rotate(9deg) translateY(-8px)}}
@keyframes party{from{transform:rotate(-12deg) translateY(0) scale(1)}to{transform:rotate(12deg) translateY(-12px) scale(1.04)}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
@keyframes breathe{0%,100%{transform:scale(1,1)}50%{transform:scale(1.03,.97)}}
@keyframes wobble{0%,100%{transform:rotate(0)}25%{transform:rotate(-4deg)}75%{transform:rotate(4deg)}}
@keyframes eggwig{0%,70%,100%{transform:rotate(0)}76%{transform:rotate(-7deg)}82%{transform:rotate(7deg)}88%{transform:rotate(-4deg)}}
@keyframes munch{from{transform:scale(1)}to{transform:scale(1.12,.9)}}
@keyframes zz{0%{opacity:0;transform:translate(0,0)}30%{opacity:1}100%{opacity:0;transform:translate(8px,-14px)}}
@keyframes wave{from{transform:rotate(0)}to{transform:rotate(-40deg)}}
@keyframes wave2{from{transform:rotate(0)}to{transform:rotate(40deg)}}
@keyframes pop{0%{transform:scale(.6);opacity:0}100%{transform:scale(1);opacity:1}}
.pop{animation:pop .35s cubic-bezier(.3,1.6,.5,1)}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

/* ---- v2: grades, trends, progress, write-offs, parent dashboard ---- */
.gp{display:inline-flex;align-items:center;gap:4px;font-family:var(--display);font-weight:600;font-size:15px;padding:2px 10px;border-radius:999px;background:#fff;font-variant-numeric:tabular-nums}
.gp .ar{font-size:12px;font-weight:700}
.up{color:#1F7A50}.down{color:#B4552B}.flat{color:#6E6688}
.g90{background:#D7F5E5}.g80{background:#DCEBFF}.g70{background:#FFF1C2}.g0{background:#FFE1CF}
.qlinks{display:flex;gap:6px;flex-direction:column;align-items:flex-end;flex:none}
.cant{font-size:13px;font-weight:800;color:var(--ink-soft);text-decoration:underline;text-underline-offset:3px;padding:2px}
.tag.ask{background:#FFE7C7;color:#8A4B00}
.quest.asked{background:#FFF6EA}

.news{display:flex;flex-direction:column;gap:8px}
.newrow{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:14px;background:var(--sky);text-align:left;width:100%}
.newrow .mini{width:44px;height:44px;flex:none}
.newrow .tt{flex:1;min-width:0}
.newrow .tt b{display:block;font-size:15px;line-height:1.2;overflow-wrap:anywhere}
.newrow .tt small{color:var(--ink-soft);font-weight:700}
.sc-chip{flex:none;min-width:48px;text-align:center;font-family:var(--display);font-weight:600;font-size:18px;padding:4px 10px;border-radius:12px;font-variant-numeric:tabular-nums}
.newbadge{font-size:11px;font-weight:800;background:var(--accent);color:var(--accent-ink);padding:2px 7px;border-radius:999px;margin-left:6px;vertical-align:2px}

.prog{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.pcard{display:flex;flex-direction:column;gap:6px;padding:12px;border-radius:var(--r-md);background:var(--sky);text-align:left;min-width:0}
.pcard .ph{display:flex;align-items:center;gap:8px}
.pcard .ph .mini{width:44px;height:44px;flex:none}
.pcard .ph b{font-family:var(--display);font-weight:600;font-size:17px;line-height:1.1;flex:1;min-width:0}
.pcard .big{font-family:var(--display);font-weight:600;font-size:30px;line-height:1;font-variant-numeric:tabular-nums}
.pcard .lbl{font-size:12px;font-weight:800;color:var(--ink-soft)}
.pcard svg.spark{width:100%;height:56px;display:block}
.trendline{font-size:13px;font-weight:700}

.chartbox{background:#FAF9FF;border-radius:16px;padding:10px 8px 4px;margin:10px 0}
.chartbox h4{font-family:var(--display);font-weight:600;font-size:16px;margin:0 6px 4px}
.chartbox svg{width:100%;height:auto;display:block}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;margin:4px 6px 6px;font-size:12px;font-weight:800;color:var(--ink-soft)}
.legend i{display:inline-block;width:12px;height:12px;border-radius:50%;margin-right:5px;vertical-align:-1px}

.reasons{display:flex;flex-direction:column;gap:8px;margin:12px 0}
.reasons label{display:flex;gap:10px;align-items:center;padding:12px;border-radius:14px;background:var(--sky);font-weight:700;cursor:pointer}
.reasons input{width:20px;height:20px;accent-color:var(--accent)}

/* Parent dashboard (full screen, calmer) */
body.parent-mode{--accent:#5B4BC4;--accent-soft:#E7E3FB;background:#F5F4FA}
.pd{display:flex;flex-direction:column;gap:18px}
.pd .top h1{font-size:30px}
.tabs{display:flex;gap:8px;flex-wrap:wrap}
.tab{padding:10px 16px;border-radius:999px;background:#fff;font-weight:800;box-shadow:0 2px 0 var(--line)}
.tab[aria-selected="true"]{background:var(--ink);color:#fff}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.tile{background:#fff;border-radius:16px;padding:14px;box-shadow:0 2px 0 var(--line)}
.tile b{display:block;font-family:var(--display);font-weight:600;font-size:30px;line-height:1.1;font-variant-numeric:tabular-nums}
.tile span{font-size:12px;font-weight:800;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.5px}
.tile.warn b{color:#B4552B}
.alerts{display:flex;flex-direction:column;gap:8px}
.alert{display:flex;gap:10px;padding:12px 14px;border-radius:14px;background:#fff;border-left:6px solid var(--line);font-weight:600}
.alert.red{border-left-color:#D64545}.alert.amber{border-left-color:#E8A23A}.alert.green{border-left-color:#3BA776}
.alert b{display:block}
.alert small{color:var(--ink-soft);font-weight:600}
.ptable{width:100%;border-collapse:collapse;font-size:14px;font-variant-numeric:tabular-nums}
.ptable th,.ptable td{padding:10px 8px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
.ptable th{font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--ink-soft)}
.ptable td.num,.ptable th.num{text-align:right}
.ptable tbody tr.click{cursor:pointer}
.ptable tbody tr.click:hover{background:#F7F5FF}
.ptable tr.sel{background:#EFEBFF}
.ptable .sname{font-weight:800}
.ptable svg{width:90px;height:26px;display:block}
.bad{color:#B4552B;font-weight:800}.ok{color:#1F7A50;font-weight:800}
.st{display:inline-block;padding:2px 8px;border-radius:999px;font-size:12px;font-weight:800}
.st.done{background:#D7F5E5;color:#1F6B4A}.st.missing{background:#FFE1CF;color:#8A3B12}.st.future{background:#E7E3FB;color:#4B3D8F}.st.wo{background:#EDEBF2;color:#6E6688}.st.ex{background:#EDEBF2;color:#6E6688}.st.pend{background:#FFF1C2;color:#7A5A00}
.drill{background:#fff;border-radius:var(--r-lg);padding:18px;box-shadow:0 4px 0 var(--line)}
.drill h2{font-size:22px}
.filters{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.filters button{padding:6px 12px;border-radius:999px;background:var(--sky);font-weight:800;font-size:13px}
.filters button[aria-pressed="true"]{background:var(--ink);color:#fff}
.mini-sel{padding:6px 8px;border-radius:10px;border:2px solid var(--line);font:inherit;font-size:13px;font-weight:700;background:#fff;color:var(--ink)}
.sbtn{padding:6px 12px;border-radius:999px;background:var(--accent);color:#fff;font-weight:800;font-size:13px}
.sbtn.ghost{background:var(--sky);color:var(--ink)}
.reqs{display:flex;flex-direction:column;gap:8px}
.req{display:flex;flex-wrap:wrap;align-items:center;gap:10px;padding:12px 14px;border-radius:14px;background:#FFF6EA}
.req .rt{flex:1 1 240px;min-width:0;font-weight:700}
.req .rt small{display:block;color:var(--ink-soft);font-weight:600}
.twocol{display:grid;grid-template-columns:1fr;gap:18px}
@media (min-width:900px){.twocol{grid-template-columns:1fr 1fr}}

.gold-wrap{position:relative;padding:4px 0 54px}
.gold-bar{position:relative;height:28px;border-radius:999px;background:#FFF6D6;box-shadow:inset 0 2px 0 rgba(0,0,0,.06);overflow:visible}
.gold-bar i{display:block;height:100%;border-radius:999px;background:linear-gradient(180deg,#FFE27A,#F5C542 55%,#E0A91E);box-shadow:0 0 14px rgba(245,197,66,.55);position:relative;overflow:hidden}
.gold-bar i::after{content:"";position:absolute;inset:0;background:linear-gradient(100deg,transparent 30%,rgba(255,255,255,.65) 45%,transparent 60%);animation:shine 2.8s ease-in-out infinite}
@keyframes shine{from{transform:translateX(-100%)}to{transform:translateX(100%)}}
.gold-bar .mark{position:absolute;top:-4px;width:4px;height:36px;border-radius:2px;background:#D9C27A;transform:translateX(-2px)}
.gold-bar .mark.hit{background:#B8860B}
.gold-labels{position:absolute;left:0;right:0;top:40px}
.glabel{position:absolute;transform:translateX(-50%);text-align:center;font-size:12px;font-weight:800;color:var(--ink-soft);white-space:nowrap;line-height:1.2}
.glabel:last-child{transform:translateX(-100%);text-align:right}
.glabel b{display:block;font-family:var(--display);font-size:15px;color:var(--ink)}
.glabel.hit b{color:#B8860B}.glabel.used{opacity:.55}
.gold-line{margin:0;font-weight:600}
.unlock{color:#9A6B00;font-weight:800}

.avatar-btn{position:relative;flex:none;border-radius:50%;box-shadow:0 3px 0 var(--line)}
.avatar-btn .edit-dot{position:absolute;right:-6px;bottom:-4px;background:var(--accent);color:var(--accent-ink);font-size:11px;font-weight:800;padding:2px 7px;border-radius:999px}
.charpick{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:8px}
.charopt{aspect-ratio:1;border-radius:16px;background:var(--sky);padding:4px;border:3px solid transparent}
.charopt.on{border-color:var(--accent);background:var(--accent-soft)}
.charopt svg{width:100%;height:100%}
.swatch{width:42px;height:42px;border-radius:50%;border:4px solid #fff;box-shadow:0 0 0 2px var(--line)}
.swatch[aria-pressed="true"]{box-shadow:0 0 0 3px var(--ink)}
.field{box-sizing:border-box;max-width:100%}

</style>
</head>
<body>
<canvas id="confetti" hidden></canvas>
<div class="wrap" id="app"></div>
<div id="layer"></div>
<script>
/* Kids mode: creature island + grown-up view. Data comes from the server (gradebook/dashboard/kids.py);
   every change is saved on the server (state/family.json, state/writeoffs.json). Plain rules, no AI. */
let P = __KIDS_DATA__;
const SPECIES={
  owl:{name:"Hoot",color:"#CBB8F2"},axolotl:{name:"Bloop",color:"#FFC2D9"},armadillo:{name:"Dilly",color:"#F2D6A8"},
  bunny:{name:"Pages",color:"#FFE59A"},fox:{name:"Fiddle",color:"#FFC3A0"},bear:{name:"Bruno",color:"#B9DBFF"},
  bug:{name:"Snap",color:"#BDEBD2"},robot:{name:"Pixel",color:"#CFD8F7"},chick:{name:"Peep",color:"#FFF0A8"},
  elephant:{name:"Trunky",color:"#C9D3E6"},monkey:{name:"Momo",color:"#E3B98F"},giraffe:{name:"Stretch",color:"#FFD98A"},
  lion:{name:"Leo",color:"#FFCB7A"},car:{name:"Zoom",color:"#FFA3AE"},dog:{name:"Biscuit",color:"#E8CFB0"},cat:{name:"Mochi",color:"#C9C4D3"}
};
const LINES=["#7B5CD6","#D9487F","#B07A2A","#C99A00","#E0703A","#3C82D6","#2E9C6A","#5C6BB5","#A0522D","#008B8B"];
const THEMES=[["berry","Berry","#E0558F"],["teal","Teal","#2E9C8F"],["grape","Grape","#7B5CD6"],["ocean","Ocean","#3C82D6"],["sunset","Sunset","#E0703A"],["leaf","Leaf","#3BA776"]];
const TONE={
  hungry:{fed:n=>`${n} gobbled it up! +1 star`,lowLine:n=>`${n} is hungry. Finishing this feeds it!`,hi:"Hi",bang:"!",clear:"Every creature is full tonight!",cheer:"You're so close!"},
  sleepy:{fed:n=>`${n} woke up. +1 star`,lowLine:n=>`${n} dozed off. Turning this in wakes it up.`,hi:"Hey",bang:"",clear:"Everyone's awake. Nice.",cheer:"Almost there."}
};
const STAGE_NAMES=["Egg","Baby","Grown-up","Hero"],STAGE_KEYS=["egg","baby","grown","hero"];
const REASONS_KID={turned_in:"I already turned it in (on paper or another way)",excused:"My teacher excused me",cannot_complete:"My teacher said I don't need to do it",other:"Something else"};
const REASON_SHORT={turned_in:"Already turned in",excused:"Excused",cannot_complete:"Teacher said skip",other:"Other"};

/* ---------- This device only: who is using it, sound on/off ---------- */
const local={get(k,d){try{const v=localStorage.getItem("kids:"+k);return v==null?d:JSON.parse(v)}catch(e){return d}},
  set(k,v){try{localStorage.setItem("kids:"+k,JSON.stringify(v))}catch(e){}}};
let S={kid:local.get("kid",null),muted:local.get("muted",false),view:"kid",ptab:"family",psub:null,pfilter:"all"};
if(S.kid&&!P.kids.some(k=>k.id===S.kid))S.kid=null;
if(location.hash==="#grownups")S.kid=null;

/* ---------- Server calls ---------- */
async function api(path,body){
  try{const r=await fetch(path,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body||{}),credentials:"same-origin"});
    const j=await r.json().catch(()=>({}));
    if(!r.ok){toast(j.error||"That didn't save. Try again.");return false}
    P=j;return true}
  catch(e){toast("Can't reach the dashboard. Check the Wi-Fi.");return false}
}

/* ---------- Data helpers ---------- */
const F=()=>P.family;
const kidById=id=>P.kids.find(k=>k.id===id);
const kid=()=>kidById(S.kid);
const subj=(k,id)=>k.subjects.find(s=>s.id===id);
const spOf=(k,s)=>F().creatures[k.id+":"+s.id]?.sp||s.sp;
const cname=(k,s)=>F().creatures[k.id+":"+s.id]?.name||SPECIES[spOf(k,s)].name;
const kidName=k=>F().profiles[k.id]?.name||k.name;
const profOf=k=>{const i=P.kids.indexOf(k);const d={pic:{type:"char",sp:k.subjects[0]?.sp||"bunny"},theme:THEMES[i%THEMES.length][0]};return {...d,...(F().profiles[k.id]||{})}};
const claimOf=key=>F().claims[key];
const reqOf=key=>F().requests[key];
const woOf=key=>P.writeoffs[key];
const tone=k=>TONE[k.low]||TONE.sleepy;
const D=iso=>new Date(iso+"T12:00:00");
const DAY=864e5,d2t=iso=>D(iso).getTime();
const addDays=(iso,n)=>new Date(d2t(iso)+n*DAY).toISOString().slice(0,10);
const fmt=iso=>iso?D(iso).toLocaleDateString("en-US",{month:"short",day:"numeric"}):"";
const esc=s=>String(s??"").replace(/[&<>"]/g,ch=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[ch]));
const R=n=>n==null?"–":Math.round(n);
const avg=a=>a.length?Math.round(a.reduce((x,y)=>x+y,0)/a.length):null;
const lineOf=(k,s)=>LINES[k.subjects.indexOf(s)%LINES.length];

const isMissing=i=>i.st==="overdue"&&!i.ts&&!woOf(i.key);
function missingAll(k){return k.items.filter(isMissing)}
function dueSoon(k){const lim=addDays(P.now,1);return k.items.filter(i=>i.st==="open"&&!i.ts&&!woOf(i.key)&&i.due&&i.due>=P.now&&i.due<=lim)}
function questsOf(k){
  const recent=addDays(P.now,-7);
  const claimedDone=k.items.filter(i=>{const c=claimOf(i.key);return c&&c.at>=recent&&!isMissing(i)&&!dueSoon(k).includes(i)&&!woOf(i.key)});
  return [...missingAll(k).filter(i=>i.term===k.term),...dueSoon(k),...claimedDone].sort((a,b)=>(b.due||"").localeCompare(a.due||""))}
function leftoversOf(k){return missingAll(k).filter(i=>i.term!==k.term).sort((a,b)=>b.due.localeCompare(a.due))}
const isOpen=i=>!claimOf(i.key)&&reqOf(i.key)?.status!=="pending";
function openMissing(k,subId){return missingAll(k).filter(i=>i.term===k.term&&(!subId||i.sub===subId)&&isOpen(i))}
function openQuests(k){return questsOf(k).filter(i=>(isMissing(i)||i.st==="open")&&isOpen(i))}
const graded=(k,subId)=>k.items.filter(i=>(i.st==="done"||i.st==="zero")&&i.score!=null&&!i.ts&&(!subId||i.sub===subId)).sort((a,b)=>a.due.localeCompare(b.due));
const verified=i=>claimOf(i.key)&&(i.st==="done"||i.st==="zero");
function starsOf(k,s){const g=graded(k,s.id).filter(i=>i.st==="done");
  return g.length+g.filter(i=>i.score>=90).length+k.items.filter(i=>i.sub===s.id&&claimOf(i.key)&&!verified(i)).length}
function stageOf(stars){let n=0;P.stages.forEach((m,i)=>{if(stars>=m)n=i});return n}
function moodOf(k,s){
  if(openMissing(k,s.id).length) return k.low;
  if(s.grade-s.prev>=5) return "party";
  if(s.grade>=P.rules.strong_at) return "dance";
  if(s.grade>=P.rules.watch_below) return "happy";
  return "ready";
}
function trend(s){const d=Math.round(s.grade-s.prev);return d>=2?{c:"up",a:"▲",d}:d<=-2?{c:"down",a:"▼",d}:{c:"flat",a:"●",d:0}}
const gcls=g=>g>=90?"g90":g>=80?"g80":g>=70?"g70":"g0";
const since=()=>P.lastCheck?`since ${fmt(P.lastCheck)}`:"since the last check";
function rolling(arr,n=5){return arr.map((_,i)=>{const w=arr.slice(Math.max(0,i-n+1),i+1);return w.reduce((a,x)=>a+x.score,0)/w.length})}
const MOOD_TEXT={hungry:"Hungry",sleepy:"Sleepy",party:"Comeback!",dance:"Dancing",happy:"Happy",ready:"Training"};
const MOOD_CLASS={hungry:"low",sleepy:"low",party:"party",dance:"dance",happy:"happy",ready:"ready"};

/* Team star bank: every star both kids earn since the season started. */
function kidSeasonStars(k){const st=F().rewards.season_start;const g=graded(k).filter(i=>i.st==="done"&&i.due>=st);
  return g.length+g.filter(i=>i.score>=90).length+k.items.filter(i=>{const c=claimOf(i.key);return c&&c.at>=st&&!verified(i)}).length}
const teamStars=()=>P.kids.reduce((a,k)=>a+kidSeasonStars(k),0);
const tiers=()=>[...F().rewards.tiers].sort((a,b)=>a.stars-b.stars);
const redeemed=st=>F().rewards.redeemed.some(r=>r.stars===st);
function starPace(){const days=Math.max(7,(d2t(P.now)-d2t(F().rewards.season_start))/DAY);return teamStars()/days*7}

/* ---------- Creature drawing (original, parametric SVG) ---------- */
function shade(hex,p){const n=parseInt(hex.slice(1),16);let r=n>>16,g=n>>8&255,b=n&255;
  const f=v=>Math.max(0,Math.min(255,Math.round(p<0?v*(1+p/100):v+(255-v)*p/100)));return "#"+[f(r),f(g),f(b)].map(v=>v.toString(16).padStart(2,"0")).join("")}
const INK="#3B3355";
function eyes(m,y){
  if(m==="dance"||m==="party") return `<path d="M39 ${y+2} Q46 ${y-7} 53 ${y+2}" stroke="${INK}" stroke-width="3.5" fill="none" stroke-linecap="round"/><path d="M67 ${y+2} Q74 ${y-7} 81 ${y+2}" stroke="${INK}" stroke-width="3.5" fill="none" stroke-linecap="round"/>`;
  if(m==="sleepy") return `<path d="M39 ${y} Q46 ${y+6} 53 ${y}" stroke="${INK}" stroke-width="3.5" fill="none" stroke-linecap="round"/><path d="M67 ${y} Q74 ${y+6} 81 ${y}" stroke="${INK}" stroke-width="3.5" fill="none" stroke-linecap="round"/>`;
  if(m==="hungry") return `<circle cx="46" cy="${y}" r="7.5" fill="#fff"/><circle cx="74" cy="${y}" r="7.5" fill="#fff"/><circle cx="47" cy="${y-2}" r="4.6" fill="${INK}"/><circle cx="75" cy="${y-2}" r="4.6" fill="${INK}"/><circle cx="48.5" cy="${y-3.5}" r="1.6" fill="#fff"/><circle cx="76.5" cy="${y-3.5}" r="1.6" fill="#fff"/>`;
  const brow=m==="ready"?`<path d="M39 ${y-10} L52 ${y-7}" stroke="${INK}" stroke-width="3" stroke-linecap="round"/><path d="M81 ${y-10} L68 ${y-7}" stroke="${INK}" stroke-width="3" stroke-linecap="round"/>`:"";
  return brow+`<circle cx="46" cy="${y}" r="5" fill="${INK}"/><circle cx="74" cy="${y}" r="5" fill="${INK}"/><circle cx="47.6" cy="${y-1.8}" r="1.7" fill="#fff"/><circle cx="75.6" cy="${y-1.8}" r="1.7" fill="#fff"/>`;
}
function mouth(m,y,sp){
  if(m==="hungry") return `<ellipse cx="60" cy="${y+2}" rx="6" ry="7" fill="#7A2E52"/><path d="M66 ${y+6} q2 6 0 8 q-2 -2 0 -8z" fill="#8FD0F2"/>`;
  if(m==="sleepy") return `<circle cx="60" cy="${y+2}" r="2.8" fill="#7A2E52"/>`;
  if(m==="dance"||m==="party") return `<path d="M50 ${y-1} Q60 ${y+12} 70 ${y-1} Z" fill="#7A2E52"/><path d="M55 ${y+4} Q60 ${y+8} 65 ${y+4}" fill="#F48FB1"/>`;
  if(sp==="owl") return "";
  if(m==="ready") return `<path d="M53 ${y+1} Q60 ${y+4} 67 ${y+1}" stroke="${INK}" stroke-width="3" fill="none" stroke-linecap="round"/>`;
  return `<path d="M52 ${y} Q60 ${y+7} 68 ${y}" stroke="${INK}" stroke-width="3" fill="none" stroke-linecap="round"/>`;
}
function ears(sp,c,d,l){
  switch(sp){
    case"owl":return `<polygon points="30,48 33,18 52,38" fill="${d}"/><polygon points="90,48 87,18 68,38" fill="${d}"/>`;
    case"axolotl":return [-1,1].map(s=>{const x0=s<0?30:90,x1=s<0?12:108;return `<g stroke="${d}" stroke-width="7" stroke-linecap="round"><line x1="${x0}" y1="56" x2="${x1}" y2="44"/><line x1="${x0}" y1="64" x2="${x1-s*2}" y2="62"/><line x1="${x0}" y1="72" x2="${x1}" y2="80"/></g>`}).join("");
    case"bunny":return `<ellipse cx="45" cy="24" rx="9" ry="24" fill="${c}"/><ellipse cx="75" cy="24" rx="9" ry="24" fill="${c}"/><ellipse cx="45" cy="26" rx="4.5" ry="16" fill="#FFB7CF"/><ellipse cx="75" cy="26" rx="4.5" ry="16" fill="#FFB7CF"/>`;
    case"fox":return `<polygon points="26,54 30,14 56,38" fill="${c}"/><polygon points="94,54 90,14 64,38" fill="${c}"/><polygon points="32,46 33,24 48,38" fill="${l}"/><polygon points="88,46 87,24 72,38" fill="${l}"/>`;
    case"bear":return `<circle cx="32" cy="42" r="13" fill="${c}"/><circle cx="88" cy="42" r="13" fill="${c}"/><circle cx="32" cy="42" r="7" fill="${l}"/><circle cx="88" cy="42" r="7" fill="${l}"/>`;
    case"armadillo":return `<ellipse cx="34" cy="40" rx="8" ry="11" fill="${d}"/><ellipse cx="86" cy="40" rx="8" ry="11" fill="${d}"/>`;
    case"bug":return `<path d="M50 40 Q44 22 36 14" stroke="${d}" stroke-width="3.5" fill="none" stroke-linecap="round"/><path d="M70 40 Q76 22 84 14" stroke="${d}" stroke-width="3.5" fill="none" stroke-linecap="round"/><circle cx="36" cy="14" r="6" fill="${d}"/><circle cx="84" cy="14" r="6" fill="${d}"/>`;
    case"robot":return `<line x1="60" y1="38" x2="60" y2="16" stroke="${d}" stroke-width="4"/><circle cx="60" cy="14" r="7" fill="#F5C542"/><rect x="18" y="62" width="9" height="14" rx="3" fill="${d}"/><rect x="93" y="62" width="9" height="14" rx="3" fill="${d}"/>`;
    case"elephant":return `<ellipse cx="22" cy="68" rx="20" ry="24" fill="${d}"/><ellipse cx="98" cy="68" rx="20" ry="24" fill="${d}"/><ellipse cx="24" cy="68" rx="12" ry="15" fill="#FFC9DA"/><ellipse cx="96" cy="68" rx="12" ry="15" fill="#FFC9DA"/>`;
    case"monkey":return `<circle cx="24" cy="66" r="12" fill="${d}"/><circle cx="96" cy="66" r="12" fill="${d}"/><circle cx="24" cy="66" r="6" fill="${l}"/><circle cx="96" cy="66" r="6" fill="${l}"/>`;
    case"giraffe":return `<line x1="48" y1="42" x2="44" y2="20" stroke="${d}" stroke-width="5" stroke-linecap="round"/><line x1="72" y1="42" x2="76" y2="20" stroke="${d}" stroke-width="5" stroke-linecap="round"/><circle cx="44" cy="18" r="6" fill="#B07A2A"/><circle cx="76" cy="18" r="6" fill="#B07A2A"/><ellipse cx="30" cy="48" rx="10" ry="5" fill="${c}" transform="rotate(-25 30 48)"/><ellipse cx="90" cy="48" rx="10" ry="5" fill="${c}" transform="rotate(25 90 48)"/>`;
    case"lion":return `<g fill="#E39A3B">${Array.from({length:14},(_,i)=>{const a=i/14*Math.PI*2;return `<circle cx="${(60+Math.cos(a)*40).toFixed(1)}" cy="${(70+Math.sin(a)*38).toFixed(1)}" r="13"/>`}).join("")}</g><circle cx="36" cy="42" r="8" fill="${c}"/><circle cx="84" cy="42" r="8" fill="${c}"/>`;
    case"car":return `<rect x="34" y="22" width="52" height="30" rx="12" fill="${d}"/><rect x="40" y="27" width="40" height="17" rx="7" fill="#CDEBFF"/>`;
    case"dog":return `<ellipse cx="26" cy="62" rx="11" ry="22" fill="#B98B63" transform="rotate(18 26 62)"/><ellipse cx="94" cy="62" rx="11" ry="22" fill="#B98B63" transform="rotate(-18 94 62)"/>`;
    case"cat":return `<polygon points="28,54 32,20 54,40" fill="${c}"/><polygon points="92,54 88,20 66,40" fill="${c}"/><polygon points="33,46 34,28 46,40" fill="#FFC9DA"/><polygon points="87,46 86,28 74,40" fill="#FFC9DA"/>`;
    case"chick":return `<ellipse cx="56" cy="34" rx="4" ry="9" fill="${d}" transform="rotate(-20 56 34)"/><ellipse cx="64" cy="33" rx="4" ry="10" fill="${d}" transform="rotate(15 64 33)"/>`;
  }return"";
}
function topper(sp,d){
  if(sp==="armadillo") return `<path d="M30 54 Q60 34 90 54" stroke="${d}" stroke-width="4" fill="none"/><path d="M28 62 Q60 42 92 62" stroke="${d}" stroke-width="3" fill="none" opacity=".6"/>`;
  if(sp==="owl") return `<polygon points="55,73 65,73 60,81" fill="#F2A65A"/>`;
  if(sp==="chick") return `<polygon points="54,73 66,73 60,80" fill="#F2A65A"/>`;
  if(sp==="elephant") return `<path d="M60 70 C60 84 62 92 68 96" stroke="${d}" stroke-width="9" fill="none" stroke-linecap="round"/>`;
  if(sp==="monkey") return `<ellipse cx="60" cy="72" rx="28" ry="22" fill="#F6E3CF"/>`;
  if(sp==="giraffe") return `<circle cx="38" cy="94" r="5" fill="#E0A33E" opacity=".6"/><circle cx="82" cy="98" r="6" fill="#E0A33E" opacity=".6"/><circle cx="86" cy="58" r="4" fill="#E0A33E" opacity=".6"/><circle cx="32" cy="58" r="4" fill="#E0A33E" opacity=".6"/>`;
  if(sp==="lion") return `<ellipse cx="60" cy="76" rx="6" ry="4" fill="#7A2E52"/>`;
  if(sp==="car") return `<circle cx="36" cy="106" r="11" fill="${INK}"/><circle cx="84" cy="106" r="11" fill="${INK}"/><circle cx="36" cy="106" r="4.5" fill="#ddd"/><circle cx="84" cy="106" r="4.5" fill="#ddd"/><circle cx="26" cy="86" r="5" fill="#FFF3B0"/><circle cx="94" cy="86" r="5" fill="#FFF3B0"/>`;
  if(sp==="dog") return `<ellipse cx="60" cy="75" rx="6" ry="4.5" fill="${INK}"/>`;
  if(sp==="cat") return `<path d="M52 46 l2 8 M60 44 v9 M68 46 l-2 8" stroke="${d}" stroke-width="3" stroke-linecap="round"/><path d="M22 76 h12 M22 82 l12 -2 M98 76 h-12 M98 82 l-12 -2" stroke="${d}" stroke-width="2" stroke-linecap="round"/>`;
  if(sp==="bug") return `<rect x="47" y="96" width="26" height="15" rx="4" fill="${INK}"/><circle cx="60" cy="103.5" r="5" fill="#9FD8F5"/>`;
  return "";
}
function creatureSVG(sp,mood,stage,extra={}){
  if(!SPECIES[sp])sp="robot";
  const stageK=typeof stage==="number"?STAGE_KEYS[stage]:stage;
  const c=SPECIES[sp].color,d=shade(c,-28),l=shade(c,45);
  const zz=mood==="sleepy"?`<text class="zz" x="92" y="30" font-family="Fredoka,sans-serif" font-weight="700" font-size="16" fill="#8A7CC9">z</text><text class="zz2" x="100" y="20" font-family="Fredoka,sans-serif" font-weight="700" font-size="12" fill="#8A7CC9">z</text>`:"";
  const apple=mood==="hungry"?`<g class="zz"><circle cx="100" cy="24" r="12" fill="#fff" stroke="#F0D9E6" stroke-width="2"/><circle cx="100" cy="26" r="6" fill="#F26B6B"/><path d="M100 20 q3 -4 6 -3" stroke="#3BA776" stroke-width="2.5" fill="none"/></g>`:"";
  const cls=extra.munch?"c-munch":(stageK==="egg"?"c-egg":"c-"+mood);
  const label=`${SPECIES[sp].name}, ${MOOD_TEXT[mood]||""}`;
  if(stageK==="egg"){
    return `<svg viewBox="0 0 120 120" role="img" aria-label="${label} (egg)"><ellipse cx="60" cy="114" rx="30" ry="5" fill="rgba(59,51,85,.12)"/><g class="${cls}">

function courseRows(k){
  return k.subjects.map(s=>{
    const cur=k.items.filter(i=>i.sub===s.id&&i.term===k.term&&!i.ts&&!woOf(i.key));
    const tests=cur.filter(i=>i.cat==="major"&&i.score!=null),daily=cur.filter(i=>i.cat==="minor"&&i.score!=null);
    const q1=s.terms.Q1,qChange=q1!=null&&k.checkpoints.includes("Q2")?Math.round(s.grade-q1):null;
    return {s,cur:s.grade,since:Math.round(s.grade-s.prev),qChange,q1,tAvg:avg(tests.map(i=>i.score)),dAvg:avg(daily.map(i=>i.score)),
      zeros:cur.filter(i=>i.st==="zero"),missing:missingAll(k).filter(i=>i.sub===s.id)}});
}
function alertsFor(k){
  const out=[],r0=P.rules;
  courseRows(k).forEach(r=>{const n=r.s.label;const curMiss=r.missing.filter(i=>i.term===k.term);
    const why=[];if(r.zeros.length)why.push(`${r.zeros.length} zero${r.zeros.length>1?"s":""} this term (${r.zeros.map(z=>esc(z.title)).join(", ")})`);
    if(curMiss.length)why.push(`${curMiss.length} missing this term`);
    if(r.tAvg!=null&&r.dAvg!=null&&Math.abs(r.tAvg-r.dAvg)>=r0.gap_points)why.push(r.dAvg>r.tAvg?`tests average ${r.tAvg} vs daily work ${r.dAvg}, so tests are pulling it down`:`daily work averages ${r.dAvg} vs tests ${r.tAvg}, so daily work is pulling it down`);
    if(r.cur<r0.failing_below)out.push({lvl:"red",sid:r.s.id,t:`${n} is at ${R(r.cur)}, below ${r0.failing_below}.`,w:why});
    else if(r.cur<r0.watch_below)out.push({lvl:"amber",sid:r.s.id,t:`${n} is at ${R(r.cur)}, below a B.`,w:why});
    else if(r.qChange!=null&&r.qChange<=-r0.drop_points)out.push({lvl:"amber",sid:r.s.id,t:`${n} dropped ${-r.qChange} points from Q1 (${R(r.q1)} to ${R(r.cur)}).`,w:why});
    else if(r.zeros.length||curMiss.length)out.push({lvl:"amber",sid:r.s.id,t:`${n} is at ${R(r.cur)}, but has work to clean up.`,w:why});
    if(r.since>=10)out.push({lvl:"green",sid:r.s.id,t:`${n} climbed ${r.since} points ${since()} (${R(r.s.prev)} to ${R(r.cur)}).`,w:[]});
  });
  return out.sort((a,b)=>({red:0,amber:1,green:2}[a.lvl]-{red:0,amber:1,green:2}[b.lvl]));
}
function stateOf(i){
  const w=woOf(i.key),c=claimOf(i.key),q=reqOf(i.key);
  if(w)return ["wo","Written off"];
  if(q&&q.status==="pending")return ["pend","Kid asked to write off"];
  if(i.st==="overdue")return c?["pend","Kid says done"]:["missing",i.ts?"No score yet":"Missing"];
  if(i.st==="open")return ["future","Not due yet"];
  if(i.st==="exempt")return ["ex","Exempt"];
  if(i.st==="zero")return ["missing","Zero"];
  return ["done","Graded"];
}
function itemByKey(key){for(const k of P.kids){const i=k.items.find(x=>x.key===key);if(i)return {k,i}}return {}}
function renderParent(){
  const tab=S.ptab;
  const reqs=Object.entries(F().requests).filter(([,w])=>w.status==="pending").map(([key,w])=>({key,w,...itemByKey(key)})).filter(r=>r.i);
  const claims=Object.entries(F().claims).map(([key,c])=>({key,c,...itemByKey(key)})).filter(r=>r.i&&!verified(r.i));
  const stale=addDays(P.now,-3);
  const needs=`<section class="panel"><h2>Needs your OK</h2>
    ${reqs.length?`<p class="sub">The kids asked to take these off their list.</p><div class="reqs">${reqs.map(r=>`<div class="req"><div class="rt">${esc(kidName(r.k))}: ${esc(r.i.title)}<small>${esc(subj(r.k,r.i.sub)?.label||"")} · due ${fmt(r.i.due)} · “${REASON_SHORT[r.w.reason]||"Other"}”${r.w.note?` · ${esc(r.w.note)}`:""} · asked ${fmt(r.w.at)}</small></div>
       <button class="sbtn" data-approve="${esc(r.key)}">Approve write-off</button><button class="sbtn ghost" data-decline="${esc(r.key)}">Say no</button></div>`).join("")}</div>`
      :`<p class="sub">No write-off requests. When a kid taps <b>Can't do this?</b>, it lands here.</p>`}
    <h3 style="font-size:18px;margin-top:16px">"I did it!" taps still waiting for a score</h3>
    ${claims.length?`<div class="reqs">${claims.map(r=>`<div class="req" style="background:${r.c.at<stale?"#FFE7E0":"#F1EEFB"}"><div class="rt">${esc(kidName(r.k))}: ${esc(r.i.title)}<small>Tapped ${fmt(r.c.at)}.${r.c.at<stale?" Still no score after 3 days: worth asking about.":" It turns gold once Skyward shows a score."}</small></div></div>`).join("")}</div>`:`<p class="sub">None right now.</p>`}
  </section>`;
  let body="";
  if(tab==="family"){
    body=`<div class="twocol">${P.kids.map(k=>{const rows=courseRows(k),cur=missingAll(k).filter(i=>i.term===k.term);const a=alertsFor(k).filter(x=>x.lvl!=="green").length;
      return `<section class="panel"><h2>${esc(kidName(k))} <span class="sub" style="margin:0;font-size:15px">${esc(k.gradeLabel)}</span></h2>
        <div class="tiles" style="margin:12px 0"><div class="tile"><b>${avg(rows.map(r=>r.cur))??"–"}</b><span>Average now</span></div>
          <div class="tile ${cur.length?"warn":""}"><b>${cur.length}</b><span>Missing this term</span></div>
          <div class="tile ${a?"warn":""}"><b>${a}</b><span>Needs a look</span></div></div>
        ${termChart(k)}
        <button class="sbtn" data-ptab="${esc(k.id)}">Open ${esc(kidName(k))}'s details</button></section>`}).join("")}</div>`;
  } else {
    const k=kidById(tab),rows=courseRows(k),al=alertsFor(k);
    const curMiss=missingAll(k).filter(i=>i.term===k.term),zeros=rows.flatMap(r=>r.zeros),wos=k.items.filter(i=>woOf(i.key));
    body=`<div class="tiles">
      <div class="tile"><b>${avg(rows.map(r=>r.cur))??"–"}</b><span>Average now</span></div>
      <div class="tile ${rows.filter(r=>r.cur<P.rules.watch_below).length?"warn":""}"><b>${rows.filter(r=>r.cur<P.rules.watch_below).length}</b><span>Below ${P.rules.watch_below}</span></div>
      <div class="tile ${curMiss.length?"warn":""}"><b>${curMiss.length}</b><span>Missing this term</span></div>
      <div class="tile"><b>${leftoversOf(k).length}</b><span>Missing, older terms</span></div>
      <div class="tile ${zeros.length?"warn":""}"><b>${zeros.length}</b><span>Zeros this term</span></div>
      <div class="tile"><b>${avg(rows.map(r=>r.tAvg).filter(v=>v!=null))??"–"} / ${avg(rows.map(r=>r.dAvg).filter(v=>v!=null))??"–"}</b><span>Tests / daily avg</span></div>
      <a class="tile" href="#wo-log" style="color:inherit;text-decoration:none"><b>${wos.length}</b><span>Written off · see list</span></a></div>
    <section class="panel"><h2>Where ${esc(kidName(k))} is lagging</h2><p class="sub">Below ${P.rules.failing_below} is red. Below ${P.rules.watch_below}, or a ${P.rules.drop_points}-point drop from Q1, is amber. A ${P.rules.gap_points}-point gap between tests and daily work is called out.</p>
      <div class="alerts">${al.map(x=>`<button class="alert ${x.lvl}" data-psub="${esc(x.sid)}" style="text-align:left;width:100%"><div><b>${x.t}</b>${x.w.length?`<small>${x.w.join(" · ")}</small>`:""}</div></button>`).join("")||`<p class="sub">Nothing to flag.</p>`}</div></section>
    <section class="panel"><h2>Every subject</h2><p class="sub">Tap a row to see every assignment.</p>
      <div class="tblwrap"><table class="ptable"><thead><tr><th>Subject</th><th>This year</th><th class="num">Now</th><th class="num">${P.lastCheck?"Since "+fmt(P.lastCheck):"Change"}</th><th class="num">vs Q1</th><th class="num">Tests</th><th class="num">Daily</th><th class="num">Zeros</th><th class="num">Missing</th></tr></thead><tbody>
      ${rows.map(r=>`<tr class="click ${S.psub===r.s.id?"sel":""}" data-psub="${esc(r.s.id)}" tabindex="0"><td class="sname">${esc(r.s.label)}</td><td>${tinySpark(k,r.s)}</td>
        <td class="num"><span class="gp ${gcls(r.cur)}">${R(r.cur)}</span></td>
        <td class="num ${r.since>=2?"ok":r.since<=-2?"bad":""}">${r.since>0?"+":""}${r.since}</td>
        <td class="num ${r.qChange!=null&&r.qChange<=-P.rules.drop_points?"bad":""}">${r.qChange==null?"–":(r.qChange>0?"+":"")+r.qChange}</td>
        <td class="num">${r.tAvg??"–"}</td><td class="num">${r.dAvg??"–"}</td>
        <td class="num ${r.zeros.length?"bad":""}">${r.zeros.length}</td><td class="num ${r.missing.length?"bad":""}">${r.missing.length}</td></tr>`).join("")}
      </tbody></table></div></section>
    ${S.psub&&subj(k,S.psub)?drill(k,S.psub):""}
    <section class="panel">${termChart(k)}</section>`;
  }
  const texts=P.kids.filter(k=>S.ptab==="family"||k.id===S.ptab).map(k=>{const low=k.subjects.filter(s=>openMissing(k,s.id).length);
    if(!low.length){const top=[...k.subjects].sort((a,b)=>b.grade-a.grade)[0];return top?`To ${kidName(k)}: ${cname(k,top)} says hi! Nothing missing tonight. ${top.label} is at ${R(top.grade)}.`:""}
    const s=low[0],n=openMissing(k,s.id).length;return `To ${kidName(k)}: ${cname(k,s)} is ${k.low==="sleepy"?"snoozing":"hungry"}. ${n} ${s.label} item${n>1?"s":""} still missing.`}).filter(Boolean);
  app.innerHTML=`<div class="pd">
    <header class="top"><div class="hello"><h1>Grown-ups</h1><p>Skyward checked ${fmt(P.today)}${P.lastCheck?` · compared with ${fmt(P.lastCheck)}`:""}</p></div>
      <a class="sbtn ghost" href="/classic" style="padding:10px 16px;text-decoration:none">Classic dashboard</a>
      <button class="sbtn ghost" id="lock" style="padding:10px 16px">${ICON.lock} Lock</button></header>
    <div class="tabs" role="tablist">${[["family","Family"],...P.kids.map(k=>[k.id,kidName(k)])].map(([v,l])=>`<button class="tab" role="tab" aria-selected="${tab===v}" data-ptab="${esc(v)}">${esc(l)}</button>`).join("")}</div>
    ${needs}
    ${writeoffPanel(tab)}
    ${rewardsPanel()}
    ${body}
    <section class="panel"><h2>Notes</h2>
      <b>Creature-style reminders for tonight</b>${texts.map(t=>`<div class="sms">${esc(t)}</div>`).join("")}
      <details style="margin-top:12px"><summary style="font-weight:800;cursor:pointer">Mood and star rules</summary><ul class="rules">
        <li>Missing work this term: the creature gets <b>hungry</b> (elementary) or <b>sleepy</b> (older kids), with weeds beside it. Set KIDS_MOODS in .env to choose.</li>
        <li>Up 5 or more ${since()}: <b>party hat</b> and Comeback Kid. ${P.rules.strong_at}+: dancing. ${P.rules.watch_below} to ${P.rules.strong_at-1}: happy. Below ${P.rules.watch_below} with nothing missing: training.</li>
        <li>The arrow next to each grade: up or down 2 or more points ${since()}, otherwise steady.</li>
        <li>Stars: 1 per graded assignment, plus 1 for 90 or more. An "I did it!" tap counts 1 until the score shows up. Creatures grow at ${P.stages.slice(1).join(", ")} stars.</li>
        <li>Written-off and teacher-scored items (participation, good character, rehearsal week) never count.</li>
        <li>The kids are never compared on their screens. The team bar shows the family total, plus each kid's own share.</li></ul></details></section>
  </div>`;
}
function writeoffPanel(tab){
  const rows=[...Object.entries(P.writeoffs).map(([key,w])=>({key,w,kind:"wo",...itemByKey(key)})),
    ...Object.entries(F().requests).filter(([,q])=>q.status==="declined").map(([key,w])=>({key,w,kind:"no",...itemByKey(key)}))]
    .filter(r=>tab==="family"||r.k?.id===tab)
    .sort((a,b)=>(a.kind===b.kind?0:a.kind==="wo"?-1:1)||String(b.w.written_off_at||b.w.decided_at||"").localeCompare(String(a.w.written_off_at||a.w.decided_at||"")));
  const n=rows.filter(r=>r.kind==="wo").length;
  return `<section class="panel" id="wo-log"><h2>Written off</h2>
    <p class="sub">${n} item${n===1?"":"s"} taken off the list${tab==="family"?"":" for "+esc(kidName(kidById(tab)))}. These never count toward moods, missing work or alerts. Undo puts one back.</p>
    ${rows.length?`<div class="tblwrap"><table class="ptable"><thead><tr>${tab==="family"?"<th>Kid</th>":""}<th>Assignment</th><th>Subject</th><th>Due</th><th>Reason</th><th>Who</th><th>Decided</th><th></th></tr></thead><tbody>
    ${rows.map(r=>{const name=r.k?kidName(r.k):(r.w.student||"");const title=r.i?.title||r.w.assignment||r.key;const sub=r.k&&r.i?subj(r.k,r.i.sub)?.label:r.w.course;
      const due=r.i?.due||r.w.due_date;const ok=r.kind==="wo";const note=ok?r.w.comment:r.w.note;
      const who=ok?(r.w.by==="kid"?`${esc(name)} asked, you approved`:"You wrote it off"):`${esc(name)} asked, you said no`;
      return `<tr>${tab==="family"?`<td>${esc(name)}</td>`:""}<td style="white-space:normal;min-width:160px"><b>${esc(title)}</b>${note?`<br><small style="color:var(--ink-soft)">“${esc(note)}”</small>`:""}</td>
      <td>${esc(sub||"")}</td><td>${fmt(due)}</td><td>${REASON_SHORT[r.w.reason]||P.reasons[r.w.reason]||"Other"}</td><td>${who}</td><td>${fmt(String(r.w.written_off_at||r.w.decided_at||"").slice(0,10))}</td>
      <td>${ok?`<span class="st wo">Written off</span> <button class="sbtn ghost" data-unwo="${esc(r.key)}">Undo</button>`:`<span class="st missing">Said no</span>`}</td></tr>`}).join("")}
    </tbody></table></div>`:`<p class="sub">Nothing written off yet.</p>`}</section>`;
}
function rewardsPanel(){
  const T=tiers(),n=teamStars(),pace=starPace(),next=T.find(t=>n<t.stars),perMonth=Math.round(pace*30/7);
  const weeks=next&&pace>0?Math.ceil((next.stars-n)/pace):null;
  return `<section class="panel"><h2>Team rewards</h2>
    <p class="sub">All the kids fill one bar. This season started ${fmt(F().rewards.season_start)}.</p>
    ${teamBar()}
    <p style="font-weight:700;margin:6px 0 12px">Pace so far: about <b>${Math.round(pace)}</b> stars a week together (${perMonth} a month).${next&&weeks?` At this pace ${esc(next.reward)} unlocks in about <b>${weeks} week${weeks>1?"s":""}</b>.`:""}</p>
    <div class="reqs">${T.map(t=>{const hit=n>=t.stars,used=redeemed(t.stars);
      return `<div class="req" style="background:${used?"#EDEBF2":hit?"#FFF3C4":"#F7F5FF"}"><div class="rt">${t.stars} stars: ${esc(t.reward)}<small>${used?"Cashed in":hit?"Unlocked, ready to cash in":`${t.stars-n} stars to go`}</small></div>
        ${hit&&!used?`<button class="sbtn" data-redeem="${t.stars}">Mark as cashed in</button>`:""}</div>`}).join("")}</div>
    <details style="margin-top:14px"><summary style="font-weight:800;cursor:pointer">Change reward levels</summary>
      <div id="tier-edit" style="display:flex;flex-direction:column;gap:8px;margin-top:10px">
      ${T.map((t,i)=>`<div class="row tier-row"><input class="field" style="flex:0 0 96px" type="number" min="1" step="5" id="ts-${i}" value="${t.stars}" aria-label="Stars"><span style="font-weight:800">stars for</span><input class="field" id="tr-${i}" maxlength="40" value="${esc(t.reward)}" aria-label="Reward"><button class="sbtn ghost" data-deltier="${i}">Remove</button></div>`).join("")}
      </div>
      <div class="row" style="margin-top:10px"><button class="sbtn ghost" id="addtier">Add a reward</button><button class="sbtn" id="savetiers">Save levels</button></div>
      <p class="sub" style="margin-top:8px">The kids earn about ${perMonth} stars a month together, so levels about ${Math.max(10,Math.round(perMonth/10)*10)} stars apart unlock about once a month.</p>
    </details>
    <div class="row" style="margin-top:12px"><button class="sbtn ghost" id="newseason">Start a new season (bar back to 0)</button></div>
  </section>`}
function readTiers(){return [...document.querySelectorAll(".tier-row")].map((row,i)=>({stars:parseInt(document.getElementById("ts-"+i).value)||0,reward:document.getElementById("tr-"+i).value.trim()}))}
function drill(k,sid){
  const s=subj(k,sid),f=S.pfilter;
  let list=k.items.filter(i=>i.sub===sid).sort((a,b)=>(b.due||"").localeCompare(a.due||""));
  if(f==="missing")list=list.filter(i=>["missing","pend"].includes(stateOf(i)[0]));
  else if(f==="major")list=list.filter(i=>i.cat==="major");
  else if(f==="term")list=list.filter(i=>i.term===k.term);
  else if(f==="low")list=list.filter(i=>i.score!=null&&i.score<70);
  if(f!=="all")list=list.filter(i=>!i.ts);
  return `<section class="drill" id="drill"><div class="row" style="justify-content:space-between"><h2>${esc(s.label)}: every assignment</h2><button class="sbtn ghost" id="drill-x">Close</button></div>
    ${scoreChart(k,s,"Scores over time")}
    <div class="filters">${[["all","All"],["term","This term"],["major","Tests and projects"],["low","Below 70"],["missing","Missing"]].map(([v,l])=>`<button data-pf="${v}" aria-pressed="${f===v}">${l}</button>`).join("")}</div>
    <div class="tblwrap"><table class="ptable"><thead><tr><th>Due</th><th>Assignment</th><th>Term</th><th>Type</th><th class="num">Score</th><th>Status</th><th></th></tr></thead><tbody>
    ${list.map((i,n)=>{const [sc,sl]=stateOf(i);const canWo=(sc==="missing"||sc==="pend")&&!i.ts;
      return `<tr><td>${fmt(i.due)}</td><td style="white-space:normal;min-width:180px">${esc(i.title)}${i.ts?' <small style="color:var(--ink-soft)">(teacher-scored)</small>':""}</td><td>${esc(i.term)}</td><td>${i.cat==="major"?"Test/project":i.cat==="minor"?"Daily":"–"}</td>
      <td class="num">${i.score==null?"–":`<span class="gp ${gcls(i.score)}">${R(i.score)}</span>`}</td><td><span class="st ${sc}">${sl}</span></td>
      <td>${canWo?`<select class="mini-sel" id="wr-${n}" aria-label="Write-off reason">${Object.entries(REASON_SHORT).map(([v,l])=>`<option value="${v}">${l}</option>`).join("")}</select> <button class="sbtn" data-wo="${esc(i.key)}" data-wr="wr-${n}">Write off</button>`
        :sc==="wo"?`<button class="sbtn ghost" data-unwo="${esc(i.key)}">Undo</button>`:""}</td></tr>`}).join("")||`<tr><td colspan="7">Nothing matches.</td></tr>`}
    </tbody></table></div></section>`;
}

/* ---------- Events ---------- */
app.addEventListener("click",async e=>{
  const t=e.target.closest("button,tr[data-psub]");if(!t)return;
  const d=t.dataset;
  if(d.pick){S.kid=d.pick;local.set("kid",S.kid);render();window.scrollTo(0,0);return}
  if(d.claim){claim(d.claim);return}
  if(d.cant){cantDo(d.cant);return}
  if(d.unclaim){if(await api("/api/unclaim",{key:d.unclaim}))render();return}
  if(d.unask){if(await api("/api/request/cancel",{key:d.unask}))render();return}
  if(d.creature){openCreature(d.creature);return}
  if(d.ptab){S.ptab=d.ptab;S.psub=null;S.pfilter="all";render();return}
  if(d.psub){S.psub=d.psub;S.pfilter="all";render();document.getElementById("drill")?.scrollIntoView({behavior:"smooth",block:"start"});return}
  if(d.pf){S.pfilter=d.pf;render();return}
  if(d.approve){if(await api("/api/request/decide",{key:d.approve,approve:true})){toast("Written off. It's off their list.");render()}return}
  if(d.decline){if(await api("/api/request/decide",{key:d.decline,approve:false})){toast("Back on their list");render()}return}
  if(d.wo){if(await api("/api/writeoffs",{key:d.wo,reason:document.getElementById(d.wr).value})){toast("Written off");render()}return}
  if(d.unwo){if(await api("/api/writeoffs/remove",{key:d.unwo})){toast("Back on the list");render()}return}
  if(d.redeem){if(await api("/api/rewards/redeem",{stars:+d.redeem})){toast("Cashed in. Enjoy!");confetti();render()}return}
  if(d.deltier){const T=readTiers();T.splice(+d.deltier,1);if(await api("/api/rewards/tiers",{tiers:T}))render();return}
  switch(t.id){
    case"swap":S.kid=null;local.set("kid",null);render();break;
    case"snd":S.muted=!S.muted;local.set("muted",S.muted);render();break;
    case"done":recap();break;
    case"friday":friday();break;
    case"parent":P.parent?openParent():pinPad();break;
    case"profile":openProfile();break;
    case"lock":await api("/api/parent/lock");S.view="kid";S.kid=null;local.set("kid",null);render();window.scrollTo(0,0);break;
    case"drill-x":S.psub=null;render();break;
    case"savetiers":if(await api("/api/rewards/tiers",{tiers:readTiers()})){toast("Reward levels saved");render()}break;
    case"addtier":{const T=readTiers();const top=Math.max(0,...T.map(x=>x.stars));T.push({stars:top+100,reward:"New reward"});if(await api("/api/rewards/tiers",{tiers:T}))render();break}
    case"newseason":if(t.dataset.sure){if(await api("/api/rewards/new-season")){toast("New season started");render()}}else{t.dataset.sure="1";t.textContent="Tap again to reset the bar to 0"}break;
  }
});
app.addEventListener("keydown",e=>{if(e.key==="Enter"&&e.target.matches("tr[data-psub]"))e.target.click()});
/* Pick up new grades and other family members' taps when the page comes back into view. */
document.addEventListener("visibilitychange",async()=>{if(document.visibilityState!=="visible"||layer.innerHTML)return;
  try{const r=await fetch("/api/kids",{credentials:"same-origin"});if(r.ok){P=await r.json();if(!P.parent&&S.view==="parent")S.view="kid";render()}}catch(e){}});
render();

</script>
</body>
</html>
