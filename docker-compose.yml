# Home hosting: `docker compose up -d --build` (or ./deploy/macmini-setup.sh, which also
# sets up the kids-dashboard.local name). Both services restart on their own after a
# reboot, as long as Docker Desktop starts at login.
services:
  # Scrapes Skyward once a day on SCHEDULE_CRON (3:00 PM Central by default), then
  # rebuilds the dashboard. Stays running between scrapes.
  scraper:
    build: .
    image: kids-gradebook:latest
    container_name: kids-scraper
    env_file: .env
    environment:
      DATA_DIR: /app/data
      STATE_DIR: /app/state
    volumes:
      - ./data:/app/data
      - ./state:/app/state:ro
    restart: unless-stopped
    # Chromium needs a bit more shared memory than Docker's 64 MB default.
    shm_size: "512mb"

  # The family dashboard, always on: http://kids-dashboard.local (or this computer's IP).
  # HTTP_PORT is the port on this computer (default 80, so no port in the address).
  # The page is built fresh from ./data on every visit. Write-offs are saved in
  # ./state/writeoffs.json, which survives restarts, rebuilds and new scrapes.
  dashboard:
    image: kids-gradebook:latest
    pull_policy: never          # built by the scraper service above
    container_name: kids-dashboard
    command: ["python", "-m", "gradebook", "serve", "--port", "8787"]
    env_file: .env
    environment:
      DATA_DIR: /app/data
      STATE_DIR: /app/state
    volumes:
      - ./data:/app/data:ro
      - ./state:/app/state
    ports:
      - "${HTTP_PORT:-80}:8787"
    depends_on:
      - scraper
    restart: unless-stopped
