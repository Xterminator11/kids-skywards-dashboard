# Home hosting: `bash deploy/macmini-setup.sh` (it also registers kids-dashboard.local with
# the shared home server in ../home-server). Both services restart on their own after a
# reboot, as long as Docker Desktop starts at login.
services:
  # Scrapes Skyward once a day on SCHEDULE_CRON (3:00 PM Central by default), then
  # rebuilds the dashboard. Stays running between scrapes.
  scraper:
    build: .
    image: kids-gradebook:latest
    container_name: kids-scraper
    env_file: .env
    environment:
      DATA_DIR: /app/data
      STATE_DIR: /app/state
    volumes:
      - ./data:/app/data
      - ./state:/app/state:ro
    restart: unless-stopped
    # Chromium needs a bit more shared memory than Docker's 64 MB default.
    shm_size: "512mb"

  # The family dashboard, always on: http://kids-dashboard.local, through the home server's
  # Caddy on port 80, which reaches this container as kids-dashboard:8787 on the shared
  # "home-proxy" network. HTTP_PORT (default 8787) is a direct backup port on this computer.
  # The page is built fresh from ./data on every visit. The family's taps and write-offs are
  # saved in ./state (family.json, writeoffs.json), which survive restarts, rebuilds and scrapes.
  dashboard:
    image: kids-gradebook:latest
    pull_policy: never          # built by the scraper service above
    container_name: kids-dashboard
    command: ["python", "-m", "gradebook", "serve", "--port", "8787"]
    env_file: .env
    environment:
      DATA_DIR: /app/data
      STATE_DIR: /app/state
    volumes:
      - ./data:/app/data:ro
      - ./state:/app/state
    ports:
      - "${HTTP_PORT:-8787}:8787"
    networks:
      - default
      - home-proxy
    depends_on:
      - scraper
    restart: unless-stopped

networks:
  # Shared with the home server's Caddy. Created by deploy/macmini-setup.sh
  # (or by hand: docker network create home-proxy).
  home-proxy:
    external: true
